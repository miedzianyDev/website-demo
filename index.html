<!DOCTYPE html>
<html>
    <head>
        <title>Strona Internetowa</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="container my-4">
            <div id="carouselExampleIndicators" class="carousel slide w-75 mx-auto" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide1"></button>

                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>

                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="bread.png" class="d-block w-100" height="800vh" alt="Slajd 1">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Tekst Slajdu 1</h5>
                            <p>Krótki opis slajdu 1.</p>
                            <a href="#" class="btn btn-primary">Dowiedz się więcej</a>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="sweet.png" class="d-block w-100" height="800vh" alt="Slajd 2">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Tekst Slajdu 2</h5>
                            <p>Krótki opis slajdu 2.</p>
                            <a href="#" class="btn btn-primary">Dowiedz się więcej</a>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="drink.png" class="d-block w-100" height="800vh" alt="Slajd 3">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Tekst Slajdu 3</h5>
                            <p>Krótki opis slajdu 3.</p>
                            <a href="#" class="btn btn-primary">Dowiedz się więcej</a>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
